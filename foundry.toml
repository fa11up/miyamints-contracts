[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Compiler is auto-detected but capped at 0.8.28, so every source resolves to 0.8.28 except the one test that
# imports v4-core's real PoolManager (pinned `=0.8.26`): test/vaults/UniAlignmentVaultRealV4.t.sol and its
# imports compile as a separate 0.8.26 unit. Production artifacts are still built with 0.8.28.
auto_detect_solc = true
compilation_restrictions = [{ paths = "**", max_version = "0.8.28" }]
optimizer = true
optimizer_runs = 100
via_ir = true
evm_version = "cancun"
test = "test"
script = "script"
broadcast = "broadcast"
fs_permissions = [{ access = "read", path = "./script/config/" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "v4-core/=lib/v4-core/src/",
    "v4-core/test/=lib/v4-core/test/",
    "createx-forge/=lib/createx-forge/",
]

# The deploy script writes deployments/<chainId>.json: `FOUNDRY_PROFILE=deploy forge script ...`
[profile.deploy]
fs_permissions = [{ access = "read-write", path = "./deployments/" }, { access = "read", path = "./script/config/" }]

# Fast local iteration: `FOUNDRY_PROFILE=lite forge test`
[profile.lite]
via_ir = false
optimizer = false

[profile.ci]
fuzz_runs = 1000
invariant_runs = 10000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
