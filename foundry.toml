[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Production compiler, pinned: src, script and every test in test/ build with solc 0.8.28 (no auto-detect, so an
# installed 0.8.30 can't sneak in).
solc_version = "0.8.28"
auto_detect_solc = false
optimizer = true
optimizer_runs = 100
via_ir = true
evm_version = "cancun"
test = "test"
script = "script"
broadcast = "broadcast"
fs_permissions = [{ access = "read", path = "./script/config/" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "v4-core/=lib/v4-core/src/",
    "v4-core/test/=lib/v4-core/test/",
    "createx-forge/=lib/createx-forge/",
]

# The deploy script writes deployments/<chainId>.json: `FOUNDRY_PROFILE=deploy forge script ...`
[profile.deploy]
fs_permissions = [{ access = "read-write", path = "./deployments/" }, { access = "read", path = "./script/config/" }]

# No `lite` (via_ir = false) profile: without via_ir, UniAlignmentVault does not compile (stack too deep), checked
# 2026-11-08 with forge 1.9. via_ir stays on in every profile.

# `FOUNDRY_PROFILE=ci forge test` (forge 1.9 ignores the old flat fuzz_runs / invariant_runs keys)
[profile.ci.fuzz]
runs = 1000

[profile.ci.invariant]
runs = 10000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
